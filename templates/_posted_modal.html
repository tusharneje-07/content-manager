<div id="posted-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 p-4 backdrop-blur-sm" data-modal>
  <div class="modal-panel w-full max-w-modal rounded-2xl p-6" role="dialog" aria-modal="true" aria-labelledby="posted-modal-title">
    <p class="mb-2 font-sans text-label uppercase text-muted">Publish status</p>

    <div data-step="confirm">
      <h2 id="posted-modal-title" class="mb-2 text-title-md text-ink">Is this post published?</h2>
      <p class="mb-6 text-base text-body">You'll be asked for the Instagram post URL before saving.</p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn-secondary" data-modal-close>Cancel</button>
        <button type="button" class="btn-accent px-4" data-step-next="url">Yes</button>
      </div>
    </div>

    <div class="hidden" data-step="url">
      <h2 class="mb-2 text-title-md text-ink">Instagram Post URL</h2>
      <label class="field-label mt-4" for="posted-modal-url">URL</label>
      <input type="url" id="posted-modal-url" class="input-field" placeholder="https://www.instagram.com/p/XXXXXXXX/" data-modal-url-input autocomplete="off">
      <p class="mb-6 mt-2 min-h-[20px] text-caption text-error" data-modal-url-error></p>
      <div class="flex justify-end gap-3">
        <button type="button" class="btn-secondary" data-step-back="confirm">Back</button>
        <button type="button" class="btn-accent px-4" data-modal-url-save>Save</button>
      </div>
    </div>
  </div>
</div>
